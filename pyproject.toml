[project]
name = "kubernetes-sre-agent"
version = "0.1.0"
description = "Open-source Kubernetes SRE AI Agent with LangGraph, Qdrant, and Ollama"
authors = [{name = "SRE Agent Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "dspy>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gradio>=5.0.0",
    "qdrant-client>=1.12.0",
    "pika>=1.3.0",
    "kubernetes>=31.0.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "typer>=0.12.0",
    "diskcache>=5.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
sre-agent = "sre_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build]
include = ["src/sre_agent"]

[tool.hatchling.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.hatchling.build.targets.sdist]
include = ["src/sre_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"

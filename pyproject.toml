[project]
name = "kubernetes-sre-agent"
version = "0.1.0"
description = "Open-source Kubernetes SRE AI Agent with LangGraph, Qdrant, and Ollama"
authors = [{name = "SRE Agent Team"}]
readme = "README.md"
requires-python = ">=3.11"
name = "k8s-sre-agent"
version = "0.1.0"
description = "Professional Kubernetes SRE AI Agent with LangGraph, DSPy, and Qdrant"
authors = [{name = "SRE Agent Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["kubernetes", "sre", "ai-agent", "langgraph", "dspy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "dspy>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gradio>=5.0.0",
    "qdrant-client>=1.12.0",
    "pika>=1.3.0",
    "kubernetes>=31.0.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "typer>=0.12.0",
    "diskcache>=5.6.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gradio>=5.0.0",
    "kubernetes>=31.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "diskcache>=5.6.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
sre-agent = "sre_agent.cli:main"
    "pytest-cov>=4.1.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
k8s-sre-agent = "k8s_sre_agent.cli:main"

[project.urls]
Repository = "https://github.com/example/k8s-sre-agent"
Documentation = "https://github.com/example/k8s-sre-agent#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build]
include = ["src/sre_agent"]

[tool.hatchling.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.hatchling.build.targets.sdist]
include = ["src/sre_agent"]
[tool.hatch.build.targets.wheel]
packages = ["src/k8s_sre_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/k8s_sre_agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]


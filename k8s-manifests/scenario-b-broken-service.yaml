apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-service-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-service-app
  template:
    metadata:
      labels:
        app: broken-service-app
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: broken-service
  namespace: default
spec:
  selector:
    app: broken-service-app
    version: v2  # Intentional mismatch - pods have version: v1
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

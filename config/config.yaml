# Kubernetes SRE Agent Configuration

llm:
  provider: openrouter  # openrouter | openai | anthropic
  model: meta-llama/llama-3.1-8b-instruct:free  # Free model via OpenRouter
  base_url: https://openrouter.ai/api/v1
  api_key: null  # Set via OPENROUTER_API_KEY env var
  temperature: 0.1

qdrant:
  host: localhost
  port: 6333
  collection: failure_patterns
  embedding_model: nomic-embed-text

rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest
  queue: sre_agent_tasks

kubernetes:
  default_namespace: default
  kubeconfig_path: null  # Uses default if null

logging:
  level: INFO
  format: json
  file: logs/sre_agent.log

monitoring:
  enabled: true
  prometheus_port: 9090

safety:
  dry_run_first: true
  require_approval: true
  max_retries: 3


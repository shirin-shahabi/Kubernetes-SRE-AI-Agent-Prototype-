apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: unavailable-test
  name: unavailable-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unavailable-test
  template:
    metadata:
      labels:
        app: unavailable-test
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep 5 && exit 1
        image: busybox
        name: crasher

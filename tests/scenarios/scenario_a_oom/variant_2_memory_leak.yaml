apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-app-v2
  namespace: default
  labels:
    app: oom-app
    variant: memory-leak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-app
      variant: memory-leak
  template:
    metadata:
      labels:
        app: oom-app
        variant: memory-leak
    spec:
      containers:
      - name: memory-leaker
        image: polinux/stress:latest
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "50M", "--vm-hang", "0", "--timeout", "60s"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"  # Will leak and exceed limit
            cpu: "200m"


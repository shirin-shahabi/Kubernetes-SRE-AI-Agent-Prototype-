# Scenario B: Broken Service - Label Mismatch
# Deploy: kubectl apply -f tests/scenarios/broken_service/label_mismatch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-svc-app
  labels:
    app: broken-svc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-svc-app
  template:
    metadata:
      labels:
        app: broken-svc-app
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: broken-svc-app
spec:
  selector:
    app: wrong-label  # Intentionally wrong - doesn't match pod labels
  ports:
  - port: 80
    targetPort: 80

